name: Release

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      signing-key-name: ${{ vars.APK_SIGNING_KEY_NAME }}
    secrets:
      signing-key: ${{ secrets.APK_SIGNING_KEY }}

  release:
    needs:
      - build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    outputs:
      package-files: ${{ steps.release.outputs.package-files }}
      attestation-files: ${{ steps.release.outputs.attestation-files}}
      release-id: ${{ steps.release.outputs.release-id }}

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
          path: ./packages/

      - name: Create Release
        id: release
        uses: rbrownwsws/release-melange-package@d437f609b161167c52c54179dd5dad309318eae3
        with:
          draft: "true"
          github-api-token: ${{ steps.app-token.outputs.token }}

      - name: Upload dist files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: dist
          path: ${{ steps.release.outputs.dist-dir }}
          retention-days: 1

      - name: Upload attestation files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: attest
          path: ${{ steps.release.outputs.attest-dir }}
          retention-days: 1

  attest-provenance-github:
    needs:
      - release

    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download dist files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: ${{ github.workspace }}/dist/

      - name: Attest GitHub build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: '${{ github.workspace }}/dist/*.apk'

  attest-provenance-melange:
    needs:
      - release

    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      matrix:
        file: ${{ fromJSON(needs.release.outputs.attestation-files) }}

    steps:
      - name: Download attest files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attest
          path: ${{ github.workspace }}/attest/

      - name: Attest melange build provenance
        uses: rbrownwsws/attest-melange-provenance@577f1140d6224a94c0acf8d0b4b6e91c1f963e6c
        with:
          attestation-file: "${{ github.workspace }}/attest/${{ matrix.file }}"

  publish-release:
    needs:
      - release
      - attest-provenance-github
      - attest-provenance-melange

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish release
        env:
          RELEASE_ID: ${{ needs.release.outputs.release-id }}
          GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          API_HEADERS=(
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer ${GITHUB_API_TOKEN}"
            --header "X-GitHub-Api-Version: 2026-03-10"
          )

          curl --silent --show-error --fail-with-body \
            --request PATCH \
            "${API_HEADERS[@]}" \
            --header "Content-Type: application/json" \
            --data '{"draft": false}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" >/dev/null

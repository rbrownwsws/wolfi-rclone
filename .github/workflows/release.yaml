name: Release

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  release:
    needs:
      - build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: ./packages/

      - name: Release package
        uses: rbrownwsws/release-melange-package@8d62e12671c645ce5f4593456e3ab1aed9617767

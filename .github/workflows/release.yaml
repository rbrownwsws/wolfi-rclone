# $schema: https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      build-arch: "amd64,arm64"
      signing-key-name: ${{ vars.APK_SIGNING_KEY_NAME }}
    secrets:
      signing-key: ${{ secrets.APK_SIGNING_KEY }}

  create-release:
    needs:
      - build

    runs-on: ubuntu-24.04

    outputs:
      release-id: ${{ steps.create-release.outputs.release-id }}
      upload-url: ${{ steps.create-release.outputs.upload-url }}

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create Release
        id: create-release
        uses: rbrownwsws/create-release@86c684b3707a42915a13b54bec1e326d3b1a6f2f # master
        with:
          tag-name: ${{ needs.build.outputs.package-fullversion }}
          github-api-token: ${{ steps.app-token.outputs.token }}

      - name: Download signing public keys
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-public-key
          path: ${{ github.workspace }}/keys/

      - name: Add signing public key to release
        uses: rbrownwsws/upload-release-asset@15bb611e9934832ac64615781fa11111de65d7d3 # master
        with:
          content-type: 'application/x-pem-file'
          file-path: ${{ github.workspace }}/keys/${{ vars.APK_SIGNING_KEY_NAME }}.rsa.pub
          upload-url: ${{ steps.create-release.outputs.upload-url }}
          github-api-token: ${{ steps.app-token.outputs.token }}

  process-build-assets:
    needs:
      - build
      - create-release

    strategy:
      matrix:
        arch: ${{ fromJSON(needs.build.outputs.arches) }}

    runs-on: ubuntu-24.04

    env:
      BUILD_PACKAGE_FILENAME: ${{ needs.build.outputs.package-fullname }}
      RELEASE_PACKAGE_FILENAME: ${{ needs.build.outputs.package-fullname }}-${{ needs.build.outputs.package-distro }}-${{ matrix.arch }}
      BUILD_DIR: ${{ github.workspace }}/packages/${{ matrix.arch }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.arch }}
          path: ${{ github.workspace }}/packages/

      - name: Prepare package file
        id: prepare-package
        shell: bash
        run: |
          set -euo pipefail

          DIST_DIR=$(mktemp -d --tmpdir="${RUNNER_TEMP}")
          echo "dist-dir=${DIST_DIR}" >> "${GITHUB_OUTPUT}"

          cp "${BUILD_DIR}/${BUILD_PACKAGE_FILENAME}.apk" "${DIST_DIR}/${RELEASE_PACKAGE_FILENAME}.apk"

      - name: Prepare melange provenance statement
        id: prepare-melange-provenance
        shell: bash
        run: |
          set -euo pipefail

          DIST_DIR=$(mktemp -d --tmpdir="${RUNNER_TEMP}")
          echo "dist-dir=${DIST_DIR}" >> "${GITHUB_OUTPUT}"

          DIGEST=$(sha256sum "${BUILD_DIR}/${BUILD_PACKAGE_FILENAME}.apk" | cut -d' ' -f1)

          # The melange build provenance is all messed up so we need to fix it first:
          # - it uses "type" instead of "_type" (melange bug - wrong according to the spec)
          # - the subject name will be wrong because we are renaming the package file
          # - the subject digest is wrong (melange bug - the data checksum instead of the whole file checksum)
          echo "Extract and fix melange build provenance attestation..."
          tar xOf "${BUILD_DIR}/${BUILD_PACKAGE_FILENAME}.attest.tar.gz" "${BUILD_PACKAGE_FILENAME}.attestation" \
          | jq \
          --arg old_name "${BUILD_PACKAGE_FILENAME}.apk" \
          --arg new_name "${RELEASE_PACKAGE_FILENAME}.apk" \
          --arg digest "${DIGEST}" \
          '
          # Fix ._type
          ._type = .type | del(.type)

          | .subject[] |= (
            if .name == $old_name then
              # Fix name
              .name = $new_name

              # Fix digest
              | .digest.sha256 = $digest
            else
              .
            end)
          ' \
          > "${DIST_DIR}/${RELEASE_PACKAGE_FILENAME}.melange.provenance.json"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: package-${{ matrix.arch }}
          path: ${{ steps.prepare-package.outputs.dist-dir }}/${{ env.RELEASE_PACKAGE_FILENAME }}.apk
          retention-days: 1

      - name: Upload melange build provenance statement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: provenance-melange-${{ matrix.arch }}
          path: ${{ steps.prepare-melange-provenance.outputs.dist-dir }}/${{ env.RELEASE_PACKAGE_FILENAME }}.melange.provenance.json
          retention-days: 1

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Add package to release
        uses: rbrownwsws/upload-release-asset@15bb611e9934832ac64615781fa11111de65d7d3 # master
        with:
          content-type: 'application/gzip'
          file-path: ${{ steps.prepare-package.outputs.dist-dir }}/${{ env.RELEASE_PACKAGE_FILENAME }}.apk
          upload-url: ${{ needs.create-release.outputs.upload-url }}
          github-api-token: ${{ steps.app-token.outputs.token }}

  attest-provenance-github:
    needs:
      - build
      - create-release
      - process-build-assets

    strategy:
      matrix:
        arch: ${{ fromJSON(needs.build.outputs.arches) }}

    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      RELEASE_PACKAGE_FILENAME: ${{ needs.build.outputs.package-fullname }}-${{ needs.build.outputs.package-distro }}-${{ matrix.arch }}

    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-${{ matrix.arch }}
          path: ${{ github.workspace }}

      - name: Attest GitHub Actions Workflow build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        id: attest
        with:
          subject-path: "${{ env.RELEASE_PACKAGE_FILENAME }}.apk"

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Add github build provenance attestation to release
        uses: rbrownwsws/upload-release-asset@15bb611e9934832ac64615781fa11111de65d7d3 # master
        with:
          content-type: 'application/vnd.dev.sigstore.bundle.v0.3+json'
          asset-name: ${{ env.RELEASE_PACKAGE_FILENAME }}.github.provenance.sigstore.json
          file-path: ${{ steps.attest.outputs.bundle-path }}
          upload-url: ${{ needs.create-release.outputs.upload-url }}
          github-api-token: ${{ steps.app-token.outputs.token }}

  attest-provenance-melange:
    needs:
      - build
      - create-release
      - process-build-assets

    strategy:
      matrix:
        arch: ${{ fromJSON(needs.build.outputs.arches) }}

    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      RELEASE_PACKAGE_FILENAME: ${{ needs.build.outputs.package-fullname }}-${{ needs.build.outputs.package-distro }}-${{ matrix.arch }}

    steps:
      - name: Download melange bulid provenance statement
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-melange-${{ matrix.arch }}
          path: ${{ github.workspace }}

      - name: Attest melange build provenance
        id: attest
        uses: rbrownwsws/attest-melange-provenance@9bf46d85bdfb2e208a069e457b724b5773c3717e # master
        with:
          statement-file: "${{ github.workspace }}/${{ env.RELEASE_PACKAGE_FILENAME }}.melange.provenance.json"

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Add melange build provenance attestation to release
        uses: rbrownwsws/upload-release-asset@15bb611e9934832ac64615781fa11111de65d7d3 # master
        with:
          content-type: 'application/vnd.dev.sigstore.bundle.v0.3+json'
          asset-name: ${{ env.RELEASE_PACKAGE_FILENAME }}.melange.provenance.sigstore.json
          file-path: ${{ steps.attest.outputs.slsa-provenance-bundle-path }}
          upload-url: ${{ needs.create-release.outputs.upload-url }}
          github-api-token: ${{ steps.app-token.outputs.token }}


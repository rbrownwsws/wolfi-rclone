name: Release

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      signing-key-name: ${{ vars.APK_SIGNING_KEY_NAME }}
    secrets:
      signing-key: ${{ secrets.APK_SIGNING_KEY }}

  release:
    needs:
      - build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: ./packages/

      - name: Release package
        uses: rbrownwsws/release-melange-package@df702ea5c82fe4851c709fbfd1d4c9a9e610f025

name: Release

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      build-arch: "amd64,arm64"
      signing-key-name: ${{ vars.APK_SIGNING_KEY_NAME }}
    secrets:
      signing-key: ${{ secrets.APK_SIGNING_KEY }}

  create-release:
    needs:
      - build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    outputs:
      release-id: ${{ steps.create-release.outputs.release-id }}
      upload-url: ${{ steps.create-release.outputs.upload-url }}

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create Release
        id: create-release
        uses: rbrownwsws/create-release@86c684b3707a42915a13b54bec1e326d3b1a6f2f # master
        with:
          tag-name: ${{ needs.build.outputs.package-fullversion }}
          github-api-token: ${{ steps.app-token.outputs.token }}

      - name: Download signing public keys
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-public-key
          path: ${{ github.workspace }}/keys/

      - name: Add signing public key to release
        uses: rbrownwsws/upload-release-asset@15bb611e9934832ac64615781fa11111de65d7d3 # master
        with:
          asset-name: "${{ vars.APK_SIGNING_KEY_NAME }}.rsa.pub"
          content-type: 'application/x-pem-file'
          file-path: ${{ github.workspace }}/keys/${{ vars.APK_SIGNING_KEY_NAME }}.rsa.pub
          upload-url: ${{ steps.create-release.outputs.upload-url }}


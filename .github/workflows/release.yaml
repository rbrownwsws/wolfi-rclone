# $schema: https://json.schemastore.org/github-workflow.json
name: Release

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      build-arch: "amd64,arm64"
      signing-key-name: ${{ vars.APK_SIGNING_KEY_NAME }}
    secrets:
      signing-key: ${{ secrets.APK_SIGNING_KEY }}

  create-release:
    needs:
      - build

    runs-on: ubuntu-24.04

    outputs:
      release-id: ${{ steps.create-release.outputs.release-id }}
      upload-url: ${{ steps.create-release.outputs.upload-url }}

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create Release
        id: create-release
        uses: rbrownwsws/create-release@86c684b3707a42915a13b54bec1e326d3b1a6f2f # master
        with:
          tag-name: ${{ needs.build.outputs.package-fullversion }}
          github-api-token: ${{ steps.app-token.outputs.token }}

      - name: Download signing public keys
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-public-key
          path: ${{ github.workspace }}/keys/

      - name: Add signing public key to release
        uses: rbrownwsws/upload-release-asset@15bb611e9934832ac64615781fa11111de65d7d3 # master
        with:
          content-type: 'application/x-pem-file'
          file-path: ${{ github.workspace }}/keys/${{ vars.APK_SIGNING_KEY_NAME }}.rsa.pub
          upload-url: ${{ steps.create-release.outputs.upload-url }}
          github-api-token: ${{ steps.app-token.outputs.token }}

  process-build-assets:
    needs:
      - build
      - create-release

    strategy:
      matrix:
        arch: ${{ fromJSON(needs.build.outputs.arches) }}

    runs-on: ubuntu-24.04

    env:
      RELEASE_PACKAGE_FILENAME: ${{ needs.build.outputs.package-fullname }}-${{ needs.build.outputs.package-distro }}-${{ matrix.arch }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-${{ matrix.arch }}
          path: ${{ github.workspace }}/packages/

      - name: Prepare build files for release
        id: prepare-dist
        shell: bash
        env:
          BUILD_DIR: ${{ github.workspace }}/packages/${{ matrix.arch }}
          BUILD_PACKAGE_FILENAME: ${{ needs.build.outputs.package-fullname }}
        run: |
          set -euo pipefail

          DIST_DIR=$(mktemp -d --tmpdir="${RUNNER_TEMP}")
          echo "dist-dir=${DIST_DIR}" >> "${GITHUB_OUTPUT}"

          echo "Copy package to dist dir..."
          cp "${BUILD_DIR}/${BUILD_PACKAGE_FILENAME}.apk" "${DIST_DIR}/${RELEASE_PACKAGE_FILENAME}.apk"

          DIGEST=$(sha256sum "${DIST_DIR}/${RELEASE_PACKAGE_FILENAME}.apk" | cut -d' ' -f1)

          # The melange build provenance is all messed up so we need to fix it first:
          # - it uses "type" instead of "_type" (melange bug - wrong according to the spec)
          # - the subject name will be wrong because we are renaming the package file
          # - the subject digest is wrong (melange bug - the data checksum instead of the whole file checksum)
          echo "Extract and fix melange build provenance attestation..."
          tar xOf "${BUILD_DIR}/${BUILD_PACKAGE_FILENAME}.attest.tar.gz" "${BUILD_PACKAGE_FILENAME}.attestation" \
          | jq \
          --arg old_name "${BUILD_PACKAGE_FILENAME}.apk" \
          --arg new_name "${RELEASE_PACKAGE_FILENAME}.apk" \
          --arg digest "${DIGEST}" \
          '
          # Fix ._type
          ._type = .type | del(.type)

          | .subject[] |= (
            if .name == $old_name then
              # Fix name
              .name = $new_name

              # Fix digest
              | .digest.sha256 = $digest
            else
              .
            end)
          ' \
          > "${DIST_DIR}/${RELEASE_PACKAGE_FILENAME}.melange.provenance.json"

      - name: Upload melange build provenance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: provenance-melange-${{ matrix.arch }}
          path: ${{ steps.prepare-dist.outputs.dist-dir }}/${{ env.RELEASE_PACKAGE_FILENAME }}.melange.provenance.json
          retention-days: 1

      - name: Generate GitHub Actions Workflow build provenance
        uses: rbrownwsws/generate-github-workflow-provenance@7e5c3fd1c5d759087cc122135da668397705320e # master
        with:
          subject-file: ${{ steps.prepare-dist.outputs.dist-dir }}/${{ env.RELEASE_PACKAGE_FILENAME }}.apk
          output-file: ${{ steps.prepare-dist.outputs.dist-dir }}/${{ env.RELEASE_PACKAGE_FILENAME }}.github.provenance.json

      - name: Upload github build provenance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: provenance-github-${{ matrix.arch }}
          path: ${{ steps.prepare-dist.outputs.dist-dir }}/${{ env.RELEASE_PACKAGE_FILENAME }}.github.provenance.json
          retention-days: 1

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Add package to release
        uses: rbrownwsws/upload-release-asset@15bb611e9934832ac64615781fa11111de65d7d3 # master
        with:
          content-type: 'application/gzip'
          file-path: ${{ steps.prepare-dist.outputs.dist-dir }}/${{ env.RELEASE_PACKAGE_FILENAME }}.apk
          upload-url: ${{ needs.create-release.outputs.upload-url }}
          github-api-token: ${{ steps.app-token.outputs.token }}

  attest-provenance-github:
    needs:
      - build
      - process-build-assets

    strategy:
      matrix:
        arch: ${{ fromJSON(needs.build.outputs.arches) }}

    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      RELEASE_PACKAGE_FILENAME: ${{ needs.build.outputs.package-fullname }}-${{ needs.build.outputs.package-distro }}-${{ matrix.arch }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download attestation statement
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-github-${{ matrix.arch }}
          path: ${{ github.workspace }}/

      - name: Sign in-toto statement
        shell: bash
        run: |
          set -euo pipefail

          # Disable Rekor while testing so we don't pollute the Rekor log
          cosign signing-config \
            create \
            --with-default-services \
            --no-default-rekor \
            --out signing-config.json

          cosign attest-blob \
            --signing-config signing-config.json \
            --oidc-provider github-actions \
            --statement "${RELEASE_PACKAGE_FILENAME}.github.provenance.json" \
            --bundle "${RELEASE_PACKAGE_FILENAME}.github.provenance.sigstore.json"

      - name: Upload github build provenance attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: sigstore-provenance-github-${{ matrix.arch }}
          path: ${{ env.RELEASE_PACKAGE_FILENAME }}.github.provenance.sigstore.json
          retention-days: 1


name: Release

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      signing-key-name: "rbrownwsws.github.io-wolfi-rclone"
    secrets:
      signing-key: ${{ secrets.APK_SIGNING_KEY }}

  release:
    needs:
      - build

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: ./packages/

      - name: Release package
        uses: rbrownwsws/release-melange-package@bb1f6c3fe7f353026a5d04ab54290da3e255c475

# $schema: https://json.schemastore.org/github-workflow.json
name: Update Repo

on:
  workflow_dispatch:
  release:
    types:
      - released

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@9d631658f55713e5f63ca0cc21ee168f81301fd9 # v1.6.30

      - name: Create package repo
        uses: rbrownwsws/create-melange-package-repo@589957f140564d80521515e25133b294c237f004
        with:
          repo-dir: "./packages/"
          signing-key: ${{ secrets.APK_SIGNING_KEY }}
          signing-key-name: ${{ vars.APK_SIGNING_KEY_NAME }}

      - name: Upload repo as artifact
        id: deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./packages/"

  deploy:
    needs: build

    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

name: Build

on:
  workflow_call:
    inputs:
      signing-key-name:
        description: "The name of the key used to sign the built packages (not including the .rsa/.rsa.pub suffix)"
        required: false
        type: string
        default: ""
    secrets:
      signing-key:
        description: "The private key used to sign the built packages (PEM format)"
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Setup melange
        uses: chainguard-dev/actions/setup-melange@fabe4ed3f66ceb5f8ec86ed7ae6d0c945ca362fb # v1.6.28

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build package
        uses: rbrownwsws/build-melange-package@dd8d27d563e275350ad382f1f90eaa9e948f5d02
        with:
          signing-key: ${{ secrets.signing-key }}
          signing-key-name: ${{ inputs.signing-key-name }}

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: build
          path: ./packages/
          retention-days: 1
